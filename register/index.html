<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nemesis · Register</title><link rel="stylesheet" href="../assets/css/main.css"></head>
<body class="auth-page"><div class="noise"></div><div class="ambient"></div><a class="auth-brand brand" href="../"><span class="brand-mark">N</span><span>NEMESIS</span></a>
